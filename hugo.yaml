baseURL: https://tpme.vonng.com/
title: The Product-Minded Engineer
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true
enableGitInfo: true

services:
  googleAnalytics:
    id: G-MET3N14S7Y

outputs:
  home: [HTML, print, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    contentDir: content/zh
    weight: 1
    title: 产品思维工程师
    params:
      description: >-
        《产品思维工程师》中文译本：从用户场景、交互设计与反馈闭环出发，
        构建真正有影响力的软件。
      time_format_default: 2006年1月2日
      ui:
        command_palette:
          commands:
            - id: start_reading
              title: 从序言开始阅读
              description: 认识产品思维工程师与本书结构
              url: /preface/
              icon: fa-solid fa-book-open
              keywords: [开始, 阅读, 序言]
            - id: open_contents
              title: 打开全书目录
              description: 浏览四个部分与九个章节
              url: /toc/
              icon: fa-solid fa-list
              keywords: [目录, 章节, 导航]
            - id: print_book
              title: 打印整本书
              description: 打开整书打印视图，可另存为 PDF
              url: /_print/
              icon: fa-solid fa-print
              keywords: [整书, 打印, PDF, print]

markup:
  goldmark:
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

menus:
  main:
    - identifier: contents
      name: 目录
      pageRef: /toc
      weight: 10
    - identifier: preface
      name: 序言
      pageRef: /preface
      weight: 20
    - identifier: original
      name: 英文原版
      url: https://learning.oreilly.com/library/view/the-product-minded-engineer/9781098173722/
      weight: 30
      params:
        icon: fa-solid fa-arrow-up-right-from-square
    - identifier: github
      name: GitHub
      url: https://github.com/Vonng/tpme
      weight: 90
      params:
        icon: fa-brands fa-github

params:
  description: >-
    《产品思维工程师》中文译本：从用户场景、交互设计与反馈闭环出发，
    构建真正有影响力的软件。
  logo: logo.png
  github_repo: https://github.com/Vonng/tpme
  github_subdir: ''
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 90
  offline_search_max_results: 12
  page_width: wide
  reading_width: normal
  copyright:
    authors: >-
      中文翻译 [Vonng](https://vonng.com) · 原著 Drew Hoskins ·
      [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
    from_year: 2026
    to_year: present
  ui:
    typography: system
    shell_types: [book]
    docs_section: ''
    quick_links: [contents, preface]
    sidebar_icon_policy: groups
    sidebar_menu_compact: false
    sidebar_menu_foldable: false
    sidebar_root_enabled: true
    sidebar_root_menu: false
    sidebar_width_min: 260
    sidebar_width_max: 360
    sidebar_item_overflow: wrap
    sidebar_headings: false
    sidebar_expand_levels: 2
    page_context_menu:
      enable: true
      assistant_links: false
      links: []
    dark_mode: true
    image_zoom: true
    feedback:
      enable: false
    reading_time: true
    pager_types: [book]
    keyboard_nav: true
    lastmod_commit: hash
  print:
    toc: true
