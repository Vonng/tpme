  title: 从开发与交付，回到探索与定义
  desc: 四部分沿着产品生命周期闭环展开：先打磨工程师手边的产品，再从反馈回到用户、问题与架构决策。
  class: tpme-chapters
  columns: 4
  items:
    - meta: 第一部分 · 第 1–2 章
      title: '[开发与打磨](part-i/)'
      desc: |
        1. [产品思维的基础](ch1/)
        2. [引导用户使用你的产品](ch2/)
    - meta: 第二部分 · 第 3–5 章
      title: '[交付](part-ii/)'
      desc: |
        3. [错误与警告](ch3/)
        4. [亲自体验你的产品](ch4/)
        5. [持续倾听用户](ch5/)
    - meta: 第三部分 · 第 6–7 章
      title: '[探索](part-iii/)'
      desc: |
        6. [理解你的目标受众](ch6/)
        7. [通过模拟发现你的产品](ch7/)
    - meta: 第四部分 · 第 8–9 章
      title: '[定义](part-iv/)'
      desc: |
        8. [交互设计](ch8/)
        9. [产品架构](ch9/)

