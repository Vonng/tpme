preface:
  eyebrow: 译序
  title: 不只把东西做对，更要知道做什么是对的
  class: tpme-preface
  body: |
    > 不懂产品的工程师做不出好软件
    >
    > —— 冯若航 / Vonng

    软件工程师往往精于系统思维，却疏于产品思维。我们擅长把东西做对（do things right），却不一定知道做什么是对的（do the right thing）。

    Drew Hoskins 在微软、Meta、Stripe 等公司摸爬滚打多年，提炼出一套将产品思维融入工程实践的方法论。从场景构建到用户研究，从交互设计到产品架构，本书为工程师提供了一个系统性的框架：如何像产品经理一样思考，同时保持工程师的严谨与深度。

    最好的工程师不仅能构建系统，还能构建用户真正需要的产品。产品思维不是产品经理的专属技能，而是每个工程师都应该掌握的核心能力。理解用户、定义问题、设计方案、验证假设——这些能力能让写出的每一行代码都更有价值。

    翻译本书，既是学习产品思维的过程，也是对自身工程实践的一次审视。希望这份译文能帮助更多中文世界的工程师，在技术精进之外，培养出更强的产品直觉。

